<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ترجِم</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <span class="logo">🔗</span>
    <h1>ترجِم</h1>
  </header>

  <p class="hint">ترجم الصفحة الحالية أو أي رابط تنسخه.</p>

  <button id="current-btn" class="btn primary">🌐 ترجمة الصفحة الحالية</button>
  <div class="row">
    <input id="url-input" type="url" dir="ltr" placeholder="https://..." aria-label="رابط">
    <button id="go-btn" class="btn">ترجم</button>
  </div>

  <a id="open-link" href="#" target="_blank" class="open">فتح ترجِم مباشرة ↖</a>

  <p id="status" class="status"></p>

  <footer class="foot">
    <label for="host-input">عنوان ترجِم:</label>
    <input id="host-input" dir="ltr" value="http://localhost:3999" aria-label="عنوان الخادم">
  </footer>

  <script src="popup.js"></script>
</body>
</html>
