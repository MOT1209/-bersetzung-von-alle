<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 40 320 320" width="80" height="80" role="img" aria-label="ترجِم">
  <title>ترجِم — favicon</title>
  <!-- العلامة وحدها بلون واحد (نيلي #1c1a17) على خلفية شفافة — آمنة على فاتح وداكن.
       نسبة الحبر: نصف قطر الحبر 144 من مركز اللوح الافتراضي < 160 (0.5 × 320)
       فتنجو من قناع الفافيكون الدائري. نفس هندسة icon.svg مصغّرة (r=100، ساق 50، فجوة 90°). -->
  <line x1="100" y1="81.25" x2="100" y2="318.75" stroke="#1c1a17" stroke-width="50" stroke-linecap="round"/>
  <path d="M 170.71 270.71 A 100 100 0 1 0 29.29 270.71" fill="none" stroke="#1c1a17" stroke-width="50"/>
</svg>
