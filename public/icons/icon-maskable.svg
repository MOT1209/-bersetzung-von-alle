<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ترجِم">
  <title>ترجِم — maskable</title>
  <!-- نسخة maskable: لوح ممتلئ بلا زوايا، والعلامة مصغّرة 0.85 داخل المنطقة الآمنة
       (نصف قطر الحبر 156 < 205 المطلوبة) — نفس هندسة icon.svg (فجوة 90°) -->
  <rect width="512" height="512" fill="#1c1a17"/>
  <g transform="translate(256 256) scale(0.85) translate(-256 -256)">
    <line x1="256" y1="104" x2="256" y2="408" stroke="#fbfaf8" stroke-width="64" stroke-linecap="round"/>
    <path d="M 346.51 346.51 A 128 128 0 1 0 165.49 346.51" fill="none" stroke="#8fabe0" stroke-width="64"/>
  </g>
</svg>
