<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ترجِم">
  <title>ترجِم</title>
  <!--
    علامة ترجِم — ألف (الساق) تمرّ من فتحة حلقة الوصلة (نسج سلسلة):
    الحلقة تعبر الساق من الأعلى (مرسومة فوقها)، وأسفلًا تفتح الحلقة فجوة 90°
    تعبرها الساق بانفراد — عرض الفتحة (64) = عرض الساق (64) تمامًا.
    الفجوة 90° بدل 60°: عند 16–48px (فافيكون/شريط الإضافة) كانت الفتحة الضيقة
    تلتقط أطراف الحلقة والساق معًا فتلتحم العلامة إلى كتلة واحدة.
    ألوان مسطّحة من DESIGN.md: اللوح #1c1a17 · الساق #fbfaf8 · الحلقة #8fabe0.
    بلا تدرّجات ولا نصوص حيّة — هندسة صرفة تصلح لأي مقاس.
  -->
  <rect width="512" height="512" rx="112" fill="#1c1a17"/>
  <!-- الألف: ساق عمودية بأطراف دائرية، تنخرج قليلًا فوق الحلقة وأسفلها (24px لكل جهة) -->
  <line x1="256" y1="104" x2="256" y2="408" stroke="#fbfaf8" stroke-width="64" stroke-linecap="round"/>
  <!-- حلقة الوصلة: قوس r=128 بفجوة 90° في الأسفل (أطراف الفجوة تلاصق حواف الساق) -->
  <path d="M 346.51 346.51 A 128 128 0 1 0 165.49 346.51" fill="none" stroke="#8fabe0" stroke-width="64"/>
</svg>
