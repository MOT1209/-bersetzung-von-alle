<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أرا لينك — مراجعة شاملة وخطة تطوير (فيديو)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1220; --bg-card:#111a2e; --bg-2:#0d1526; --border:#1f2b45;
    --text:#e6edf7; --muted:#8b9bb8; --primary:#6366f1; --primary-2:#8b5cf6;
    --accent:#22d3ee; --success:#34d399; --warning:#fbbf24; --danger:#f87171;
    --grad:linear-gradient(135deg,#6366f1,#8b5cf6);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Cairo",system-ui,"Segoe UI",Tahoma,sans-serif;
    overflow:hidden; line-height:1.8;
  }
  code,.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;direction:ltr;unicode-bidi:isolate}

  /* ===== المسرح ===== */
  #stage{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    padding:clamp(20px,5vw,72px);
  }
  .scene{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:clamp(24px,6vw,90px);
    opacity:0; visibility:hidden;
    transition:opacity .6s ease, transform .6s ease;
    transform:scale(1.04);
  }
  .scene.active{opacity:1; visibility:visible; transform:scale(1); z-index:2}
  .scene.done{opacity:0; transform:scale(.97)}

  /* خلفية متحركة */
  .bg-orbs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35;animation:float 18s ease-in-out infinite}
  .orb.a{width:44vw;height:44vw;background:#6366f1;top:-12vw;right:-10vw}
  .orb.b{width:38vw;height:38vw;background:#22d3ee;bottom:-14vw;left:-8vw;animation-delay:-6s}
  .orb.c{width:30vw;height:30vw;background:#8b5cf6;top:30%;left:20%;animation-delay:-11s;opacity:.22}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(3vw,-4vh) scale(1.08)}}

  .wrap{width:min(1080px,100%);position:relative;z-index:3}
  .kicker{
    display:inline-flex;align-items:center;gap:8px;
    font-size:.82rem;font-weight:700;letter-spacing:.02em;
    color:var(--accent);background:rgba(34,211,238,.1);
    border:1px solid rgba(34,211,238,.25);border-radius:999px;
    padding:6px 14px;margin-bottom:22px;
  }
  h1.title{font-size:clamp(2rem,5.4vw,3.7rem);font-weight:800;line-height:1.15;letter-spacing:-.01em}
  h2.title{font-size:clamp(1.5rem,3.6vw,2.5rem);font-weight:800;line-height:1.2;margin-bottom:26px}
  .grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  p.lead{font-size:clamp(1rem,1.7vw,1.3rem);color:var(--muted);max-width:44ch;margin-top:18px}

  /* عناصر تظهر بالتتابع */
  .rise{opacity:0;transform:translateY(22px);animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
  .scene.active .rise{animation-play-state:running}
  @keyframes rise{to{opacity:1;transform:none}}
  .d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}
  .d4{animation-delay:.75s}.d5{animation-delay:.95s}.d6{animation-delay:1.15s}
  .d7{animation-delay:1.35s}.d8{animation-delay:1.55s}.d9{animation-delay:1.75s}

  /* شبكات وبطاقات */
  .grid{display:grid;gap:16px;margin-top:10px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:820px){.g3,.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
  .card{
    background:linear-gradient(180deg,rgba(17,26,46,.9),rgba(13,21,38,.9));
    border:1px solid var(--border);border-radius:16px;padding:20px 22px;
    backdrop-filter:blur(10px);
  }
  .card h3{font-size:1.05rem;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:9px}
  .card p{font-size:.92rem;color:var(--muted)}
  .card .em{font-size:1.7rem;line-height:1}
  .tag{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;margin-top:10px}
  .t-ok{background:rgba(52,211,153,.14);color:var(--success)}
  .t-warn{background:rgba(251,191,36,.14);color:var(--warning)}
  .t-bad{background:rgba(248,113,113,.14);color:var(--danger)}
  .t-info{background:rgba(99,102,241,.16);color:#a5b4fc}

  ul.checks{list-style:none;display:flex;flex-direction:column;gap:12px;margin-top:8px;text-align:right}
  ul.checks li{display:flex;gap:12px;align-items:flex-start;font-size:1.02rem}
  ul.checks .ic{flex:0 0 auto;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:.9rem;font-weight:800}
  .ic.ok{background:rgba(52,211,153,.16);color:var(--success)}
  .ic.no{background:rgba(248,113,113,.16);color:var(--danger)}
  .ic.mid{background:rgba(251,191,36,.16);color:var(--warning)}
  ul.checks small{display:block;color:var(--muted);font-size:.85rem;margin-top:2px}

  /* عدّادات */
  .stats{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;margin-top:14px}
  .stat{text-align:center}
  .stat .n{font-size:clamp(2.2rem,5vw,3.4rem);font-weight:800;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .stat .l{color:var(--muted);font-size:.9rem;margin-top:8px}

  /* مخطط المعمارية */
  .arch{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:10px;width:100%}
  .arch-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .node{
    background:var(--bg-card);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;font-size:.9rem;font-weight:700;min-width:120px;text-align:center
  }
  .node.hi{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.18)}
  .arrow{color:var(--muted);font-size:1.4rem;align-self:center}

  /* الجدول الزمني للطريق */
  .road{display:flex;flex-direction:column;gap:12px;margin-top:6px;width:100%}
  .road .row{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;
    background:rgba(17,26,46,.7);border:1px solid var(--border);border-radius:12px;padding:12px 16px}
  .road .ph{font-weight:800;color:var(--accent);font-size:.9rem}
  .road .row p{font-size:.92rem;color:var(--muted)}
  .road .row b{color:var(--text)}
  @media(max-width:700px){.road .row{grid-template-columns:1fr}}

  /* ===== شريط التحكم (كواجهة مشغّل فيديو) ===== */
  #hud{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:linear-gradient(0deg,rgba(11,18,32,.96),rgba(11,18,32,.55) 70%,transparent);
    padding:26px clamp(16px,4vw,54px) 16px;
  }
  #caption{
    text-align:center;font-size:clamp(.95rem,1.7vw,1.15rem);color:#cdd8ec;
    min-height:2.6em;max-width:70ch;margin:0 auto 12px;font-weight:600
  }
  #timeline{display:flex;gap:5px;margin-bottom:12px}
  #timeline .seg{flex:1;height:5px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden;cursor:pointer}
  #timeline .seg i{display:block;height:100%;width:0;background:var(--grad);border-radius:999px}
  #timeline .seg.done i{width:100%}
  .controls{display:flex;align-items:center;gap:10px;justify-content:center}
  .controls button{
    background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text);
    width:44px;height:44px;border-radius:12px;font-size:1.05rem;cursor:pointer;
    display:grid;place-items:center;transition:.15s
  }
  .controls button:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}
  .controls .big{width:54px;height:54px;background:var(--grad);border:none;font-size:1.3rem}
  .controls .label{font-size:.8rem;color:var(--muted);min-width:8ch;text-align:center}

  #intro-hint{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(11,18,32,.82);backdrop-filter:blur(6px)}
  #intro-hint .box{text-align:center;padding:40px}
  #intro-hint h2{font-size:clamp(1.4rem,3vw,2rem);font-weight:800;margin-bottom:10px}
  #intro-hint p{color:var(--muted);margin-bottom:24px}
  #intro-hint button{background:var(--grad);border:none;color:#fff;font-family:inherit;font-weight:800;
    font-size:1.05rem;padding:14px 34px;border-radius:14px;cursor:pointer}

  @media (prefers-reduced-motion:reduce){
    .scene,.rise,.orb{transition:none!important;animation:none!important;opacity:1!important;transform:none!important;visibility:visible}
    .scene:not(.active){display:none}
  }
</style>
</head>
<body>

<div class="bg-orbs"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></div>

<div id="stage"><!-- المشاهد تُحقن هنا --></div>

<div id="hud">
  <div id="caption"></div>
  <div id="timeline"></div>
  <div class="controls">
    <button id="restart" title="من البداية">⟲</button>
    <button id="prev" title="السابق">⏮</button>
    <button id="play" class="big" title="تشغيل / إيقاف">⏸</button>
    <button id="next" title="التالي">⏭</button>
    <span class="label" id="clock">00:00</span>
  </div>
</div>

<div id="intro-hint">
  <div class="box">
    <div class="kicker" style="margin-inline:auto">🎬 عرض مرئي • ~2 دقيقة • محدَّث 2026-08-28</div>
    <h2>أرا لينك — المراجعة وما نُفّذ منها</h2>
    <p>عرض تلقائي يشرح حالة المشروع، نقاط القوة والضعف ومصير كل منها بعد التنفيذ، وما تبقّى من أفكار التطوير.<br>استخدم أزرار التحكم بالأسفل أو مفاتيح ← → ومسافة.</p>
    <button id="start-btn">▶ ابدأ العرض</button>
  </div>
</div>

<script>
/* ============ محتوى المشاهد ============ */
const SCENES = [
  {
    dur: 8,
    caption: "مراجعة مشروع «أرا لينك» — وهذه النسخة محدّثة بعد تنفيذ المرحلتين الأولى والثانية من خطة التطوير.",
    html: `<div class="wrap" style="text-align:center">
      <div class="kicker rise" style="margin-inline:auto">تقرير فني • محدَّث 2026-08-28</div>
      <h1 class="title rise d1">مراجعة شاملة لمشروع<br><span class="grad-text">أرا لينك</span></h1>
      <p class="lead rise d3" style="margin-inline:auto">أداة ترجمة تحوّل أي رابط (يوتيوب، مقالات، مواقع) وأي ملف إلى أي لغة — واجهة عربية RTL، خادم Node.js/Express، بلا قاعدة بيانات.</p>
      <div class="stats rise d5">
        <div class="stat"><div class="n">~5.9k</div><div class="l">سطر خادم</div></div>
        <div class="stat"><div class="n">32</div><div class="l">وحدة خلفية</div></div>
        <div class="stat"><div class="n">248</div><div class="l">اختبار ناجح</div></div>
        <div class="stat"><div class="n">50</div><div class="l">التزام Git</div></div>
      </div>
    </div>`
  },
  {
    dur: 11,
    caption: "المشروع ليس فكرة على ورق — بُني على 7 «أمواج» متتابعة، كل موجة أضافت قدرة حقيقية ومختبَرة.",
    html: `<div class="wrap">
      <div class="kicker rise">ما الذي أُنجز فعلاً</div>
      <h2 class="title rise d1">سبع أمواج مكتملة</h2>
      <div class="grid g3">
        <div class="card rise d2"><span class="em">🔗</span><h3>الأساس</h3><p>ترجمة رابط/نص، استخراج مقالات (cheerio)، ترجمات يوتيوب، تقسيم ذكي للنص الطويل.</p></div>
        <div class="card rise d3"><span class="em">🔊</span><h3>مسار الصوت</h3><p>تفريغ الفيديوهات بلا ترجمات محليًا (sherpa-onnx / Whisper) ثم ترجمة موقوتة + SRT.</p></div>
        <div class="card rise d4"><span class="em">⚡</span><h3>السرعة واللغات</h3><p>كاش ترجمة دائم على القرص، 130 لغة، مشغّل فيديو مترجم متزامن.</p></div>
        <div class="card rise d5"><span class="em">🧩</span><h3>مزوّدون + ملفات</h3><p>6 مزوّدات موحّدة (Google/MyMemory/Libre/Gemini/DeepL/zen)، 11 صيغة إدخال و8 إخراج.</p></div>
        <div class="card rise d6"><span class="em">📝</span><h3>تشكيل + OCR + فيديو محلي</h3><p>تشكيل عربي، استخراج نص من الصور (Tesseract) وPDF، رفع فيديو محلي.</p></div>
        <div class="card rise d7"><span class="em">📡</span><h3>البث + لوحة التحكم</h3><p>ترجمة بث مباشر SSE، لوحة إحصائيات admin، كشف سياق المحتوى تلقائيًا.</p></div>
      </div>
      <p class="lead rise d8" style="max-width:none;font-size:1rem;margin-top:16px">…وأُضيفت الآن <b style="color:var(--accent)">موجة ثامنة</b>: تثبيت الجودة + لوحة قياس جودة الترجمة + طبقة تخزين قابلة للتوسّع.</p>
    </div>`
  },
  {
    dur: 10,
    caption: "المعمارية بسيطة ومقصودة: المتصفح لا يجلب المحتوى أبدًا — كل شيء يمر عبر بروكسي الخادم لتفادي حجب CORS.",
    html: `<div class="wrap" style="text-align:center">
      <div class="kicker rise" style="margin-inline:auto">المعمارية</div>
      <h2 class="title rise d1">تدفّق واحد واضح</h2>
      <div class="arch">
        <div class="arch-row rise d2"><div class="node hi">الواجهة<br><small>public/ — RTL</small></div></div>
        <div class="arrow rise d3">↓</div>
        <div class="arch-row rise d4"><div class="node">Express<br><small>server.js + راوترات</small></div></div>
        <div class="arrow rise d5">↓</div>
        <div class="arch-row rise d6">
          <div class="node">جلب المحتوى<br><small>fetchContent / youtube</small></div>
          <div class="node">محرك الترجمة<br><small>سلسلة مزوّدين + كاش</small></div>
          <div class="node">صوت / OCR / PDF<br><small>معالجة محلية</small></div>
        </div>
        <div class="arrow rise d7">↓</div>
        <div class="arch-row rise d8"><div class="node hi">نتيجة مترجمة + SRT + صوت عربي</div></div>
      </div>
    </div>`
  },
  {
    dur: 10,
    caption: "بعد التنفيذ صارت كل المؤشرات خضراء: لا اختبار فاشل، ولا تحذير lint، وكل ملف يمر فحص الصياغة.",
    html: `<div class="wrap">
      <div class="kicker rise">لقطة الصحة — بعد التنفيذ</div>
      <h2 class="title rise d1">كل المؤشرات خضراء</h2>
      <div class="grid g4">
        <div class="card rise d2" style="text-align:center"><div class="stat"><div class="n">51/51</div><div class="l">node --check سليم</div></div></div>
        <div class="card rise d3" style="text-align:center"><div class="stat"><div class="n">248/248</div><div class="l">اختبارات ناجحة</div></div></div>
        <div class="card rise d4" style="text-align:center"><div class="stat"><div class="n">0</div><div class="l">تحذير lint (كانت 23)</div></div></div>
        <div class="card rise d5" style="text-align:center"><div class="stat"><div class="n">✔</div><div class="l">CSP + CORS allowlist + SSRF</div></div></div>
      </div>
      <ul class="checks" style="margin-top:20px">
        <li class="rise d6"><span class="ic ok">✓</span><div>حدود طلبات لكل IP، حجب SSRF للعناوين الداخلية، تنقية المفاتيح من رسائل الخطأ، كتابة كاش ذرّية آمنة على Windows/OneDrive.</div></li>
        <li class="rise d7"><span class="ic ok">✓</span><div>الاختبار الفاشل أُصلح، و<code>npm run lint</code> صار <code>--max-warnings=0</code> — أي تحذير جديد يكسر CI فلا يتراكم الدين مجددًا.</div></li>
      </ul>
    </div>`
  },
  {
    dur: 11,
    caption: "نقاط القوة: تصميم واضح، تغطية اختبارات عالية، ومرونة تشغيل — كل الترجمة مجانية مع احتياطي تلقائي.",
    html: `<div class="wrap">
      <div class="kicker rise">التقييم — ما يعمل جيدًا</div>
      <h2 class="title rise d1">نقاط القوة</h2>
      <ul class="checks">
        <li class="rise d2"><span class="ic ok">✓</span><div><b>سلسلة مزوّدين ذكية</b><small>فشل مزوّد → الانتقال للتالي تلقائيًا، وتجميد 60 ثانية بعد 3 إخفاقات لحماية الحصص المجانية.</small></div></li>
        <li class="rise d3"><span class="ic ok">✓</span><div><b>عقد أخطاء موحّد</b><small>خريطة رمز خطأ → حالة HTTP، رسائل عربية للمستخدم، لا إخفاقات صامتة.</small></div></li>
        <li class="rise d4"><span class="ic ok">✓</span><div><b>وثائق ومواصفات منظّمة</b><small>مجلد <code>specs/</code> يقسّم كل ميزة إلى مهام متوازية مع معايير قبول — نادر في مشاريع بهذا الحجم.</small></div></li>
        <li class="rise d5"><span class="ic ok">✓</span><div><b>احترام المصدر والخصوصية</b><small>معالجة الصوت وOCR محليًا بلا مفاتيح، بلا قاعدة بيانات، بلا تتبّع.</small></div></li>
        <li class="rise d6"><span class="ic ok">✓</span><div><b>تجربة واجهة ناضجة</b><small>PWA، وضع فاتح/داكن، سجل محلي، مشغّل فيديو متزامن، امتداد متصفح.</small></div></li>
      </ul>
    </div>`
  },
  {
    dur: 13,
    caption: "هذه كانت نقاط الضعف الست في المراجعة الأولى — خمس منها عولجت بالكامل، وبقيت واحدة خارج سيطرتنا.",
    html: `<div class="wrap">
      <div class="kicker rise">التقييم — نقاط الضعف ومصيرها</div>
      <h2 class="title rise d1">5 من 6 عولجت <span style="color:var(--success);font-size:.55em">✓</span></h2>
      <ul class="checks">
        <li class="rise d2"><span class="ic ok">✓</span><div><b>واجهة أحادية الملف — <code>public/script.js</code></b><small><s>2096 سطرًا في ملف واحد.</s> حُذف بالكامل؛ الواجهة الآن 10 وحدات ES تحت <code>public/js/</code> بمدخل <code>app.js</code>.</small></div></li>

/* ============ المحرّك ============ */
const stage = document.getElementById('stage');
const timeline = document.getElementById('timeline');
const captionEl = document.getElementById('caption');
const clockEl = document.getElementById('clock');
const playBtn = document.getElementById('play');
const totalDur = SCENES.reduce((s,x)=>s+x.dur,0);
let idx = 0, playing = false, sceneStart = 0, raf = null, elapsedBefore = 0;

SCENES.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'scene';
  el.innerHTML = s.html;
  el.dataset.i = i;
  stage.appendChild(el);
  const seg = document.createElement('div');
  seg.className = 'seg';
  seg.innerHTML = '<i></i>';
  seg.addEventListener('click', ()=>goto(i));
  timeline.appendChild(seg);
});
const sceneEls = [...document.querySelectorAll('.scene')];
const segEls = [...document.querySelectorAll('#timeline .seg')];

function fmt(t){const m=Math.floor(t/60),s=Math.floor(t%60);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}

function renderScene(){
  sceneEls.forEach((el,i)=>{
    el.classList.toggle('active', i===idx);
    el.classList.toggle('done', i<idx);
  });
  segEls.forEach((seg,i)=>{
    seg.classList.toggle('done', i<idx);
    seg.querySelector('i').style.width = i<idx ? '100%' : '0%';
  });
  captionEl.textContent = SCENES[idx].caption;
  captionEl.style.animation='none'; void captionEl.offsetWidth; captionEl.style.animation='rise .6s ease forwards';
  elapsedBefore = SCENES.slice(0,idx).reduce((s,x)=>s+x.dur,0);
}

function tick(ts){
  if(!playing) return;
  if(!sceneStart) sceneStart = ts;
  const inScene = (ts - sceneStart)/1000;
  const cur = SCENES[idx];
  const frac = Math.min(inScene/cur.dur, 1);
  segEls[idx].querySelector('i').style.width = (frac*100)+'%';
  clockEl.textContent = fmt(elapsedBefore + inScene);
  if(inScene >= cur.dur){
    if(idx < SCENES.length-1){ idx++; sceneStart = ts; renderScene(); }
    else { pause(); segEls[idx].querySelector('i').style.width='100%'; clockEl.textContent=fmt(totalDur); return; }
  }
  raf = requestAnimationFrame(tick);
}

function play(){
  if(idx===SCENES.length-1){
    const cur=SCENES[idx];
    // لو المشهد الأخير مكتمل، أعد من البداية
  }
  playing = true; playBtn.textContent='⏸'; sceneStart = 0;
  cancelAnimationFrame(raf); raf = requestAnimationFrame(tick);
}
function pause(){ playing=false; playBtn.textContent='▶'; cancelAnimationFrame(raf); }
function goto(i){ idx = Math.max(0, Math.min(SCENES.length-1, i)); sceneStart=0; renderScene(); if(playing){cancelAnimationFrame(raf); raf=requestAnimationFrame(tick);} else {clockEl.textContent=fmt(SCENES.slice(0,idx).reduce((s,x)=>s+x.dur,0));} }

playBtn.addEventListener('click', ()=> playing ? pause() : play());
document.getElementById('next').addEventListener('click', ()=>goto(idx+1));
document.getElementById('prev').addEventListener('click', ()=>goto(idx-1));
document.getElementById('restart').addEventListener('click', ()=>{ goto(0); play(); });
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft') goto(idx+1);        // RTL: يسار = التالي
  else if(e.key==='ArrowRight') goto(idx-1);
  else if(e.key===' '){ e.preventDefault(); playing?pause():play(); }
});

document.getElementById('start-btn').addEventListener('click', ()=>{
  document.getElementById('intro-hint').style.display='none';
  renderScene(); play();
});
renderScene();
</script>
